name: Release (Ruby)

on:
  push:
    tags:
      - 'ruby-v*'

defaults:
  run:
    working-directory: sdks/ruby

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: sdks/ruby

      - name: Verify tag matches version.rb
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#ruby-v}"
          CODE_VERSION="$(grep -oE "VERSION = '[^']+'" lib/mobiscroll/connect/version.rb | sed -E "s/VERSION = '(.+)'/\1/")"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match version.rb ($CODE_VERSION)"
            exit 1
          fi

      - name: Run tests
        run: bundle exec rspec

      - name: Build gem
        run: gem build mobiscroll-connect.gemspec

      - name: RubyGems login (OIDC trusted publishing)
        uses: rubygems/configure-rubygems-credentials@main

      - name: Push to RubyGems
        run: gem push mobiscroll-connect-*.gem

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#ruby-v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag = 1; next }
            flag && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            flag { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "No CHANGELOG.md entry found for $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ruby ${{ steps.changelog.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
