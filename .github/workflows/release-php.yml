name: Release (PHP)

on:
  push:
    tags:
      - 'php-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MIRROR_REPO: acidb/mobiscroll-connect-php
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Verify tag matches CHANGELOG
        working-directory: sdks/php
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#php-v}"
          if ! grep -qE "^## \[${TAG_VERSION}\]" CHANGELOG.md; then
            echo "Tag ($TAG_VERSION) has no matching CHANGELOG.md entry"
            exit 1
          fi

      - name: Install and test
        working-directory: sdks/php
        run: |
          composer install --no-progress --prefer-dist
          composer run lint
          composer run stan
          composer run test

      - name: Configure SSH for mirror push
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PHP_MIRROR_DEPLOY_KEY }}

      - name: Push sdks/php subtree to mirror repo
        run: |
          VERSION="${GITHUB_REF_NAME#php-v}"
          SUBTREE_SHA="$(git subtree split --prefix=sdks/php HEAD)"
          git remote add mirror git@github.com:${MIRROR_REPO}.git
          git push mirror "${SUBTREE_SHA}:refs/heads/main" --force
          git push mirror "${SUBTREE_SHA}:refs/tags/v${VERSION}"

      - name: Extract changelog entry
        id: changelog
        working-directory: sdks/php
        run: |
          VERSION="${GITHUB_REF_NAME#php-v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag = 1; next }
            flag && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            flag { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "No CHANGELOG.md entry found for $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PHP ${{ steps.changelog.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
