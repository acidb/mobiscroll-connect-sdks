name: Release (Java)

on:
  push:
    tags:
      - 'java-v*'

defaults:
  run:
    working-directory: sdks/java

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify tag matches pom revision
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#java-v}"
          POM_VERSION="$(grep -oE '\-Drevision=[^[:space:]]+' .mvn/maven.config | sed -E 's/^-Drevision=//')"
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match .mvn/maven.config revision ($POM_VERSION)"
            exit 1
          fi

      - name: Build & verify
        run: mvn -B -ntp -pl connect-sdk -am verify

      - name: Deploy to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -ntp -Prelease -pl connect-sdk -am deploy -DskipTests

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#java-v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { flag = 1; next }
            flag && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            flag { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "No CHANGELOG.md entry found for $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Java ${{ steps.changelog.outputs.version }}
          body_path: ${{ runner.temp }}/release-notes.md
